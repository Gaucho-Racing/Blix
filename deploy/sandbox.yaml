apiVersion: v1
kind: ConfigMap
metadata:
  name: blix-sandbox-config
data:
  SANDBOX_IMAGE: blix-ohmypi:18.5.0
  SANDBOX_MODEL: gpt-6-astra
  SANDBOX_REPOSITORIES: gaucho-racing/*
  SANDBOX_CONCURRENCY: "2"
  SANDBOX_TIMEOUT_SECONDS: "1800"
  SANDBOX_MEMORY_MB: "2048"
  SANDBOX_CPUS: "2"
  LLM_GATEWAY_ENDPOINT: https://oracle.withpersona.ai/api/external/openai-proxy/v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blix-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blix-sandbox
  template:
    metadata:
      labels:
        app: blix-sandbox
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: host
          image: blix-sandbox:local
          command:
            - sh
            - -c
            - >-
              until [ -S /docker/docker.sock ]; do sleep 1; done;
              exec /app/.venv/bin/blix-sandbox
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: blix-sandbox-config
            - secretRef:
                name: blix-sandbox-secrets
          volumeMounts:
            - name: socket
              mountPath: /docker
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: docker
          image: docker:29.5.1-dind
          securityContext:
            privileged: true
          args:
            - dockerd
            - --host=unix:///docker/docker.sock
            - --group=0
            - --storage-driver=overlay2
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: socket
              mountPath: /docker
            - name: docker-data
              mountPath: /var/lib/docker
          readinessProbe:
            exec:
              command: [docker, --host=unix:///docker/docker.sock, info]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "6"
              memory: 8Gi
              ephemeral-storage: 30Gi
      volumes:
        - name: socket
          emptyDir: {}
        - name: docker-data
          emptyDir:
            sizeLimit: 25Gi
---
apiVersion: v1
kind: Service
metadata:
  name: blix-sandbox
spec:
  selector:
    app: blix-sandbox
  ports:
    - port: 8080
      targetPort: 8080
