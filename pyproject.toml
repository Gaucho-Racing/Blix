[project]
name = "blix-agent-runtime"
version = "0.1.0"
description = "Provider-neutral agent runtime for Blix"
requires-python = ">=3.12,<4.0"
dependencies = [
    "litellm>=1.83.3,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.scripts]
blix-agent = "blix_agent_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blix_agent_runtime"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

