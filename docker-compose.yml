name: blix

services:
  cli:
    profiles:
      - cli
    build:
      context: ./cli
      dockerfile: Dockerfile.dev
    working_dir: /app
    stdin_open: true
    tty: true
    network_mode: host
    user: "${BLIX_CLI_UID:?Set BLIX_CLI_UID in .env}:${BLIX_CLI_GID:?Set BLIX_CLI_GID in .env}"
    environment:
      HOME: ${BLIX_CLI_HOME:?Set BLIX_CLI_HOME in .env}
      BLIX_URL: ${BLIX_URL:?Set BLIX_URL in .env}
    volumes:
      - ${BLIX_CREDENTIALS_DIR:?Set BLIX_CREDENTIALS_DIR in .env}:/home/blix/.blix

  kerbecs:
    container_name: blix-kerbecs
    image: bk1031/kerbecs:latest
    ports:
      - "127.0.0.1:10310:10310"
    volumes:
      - ./kerbecs.yaml:/etc/kerbecs/kerbecs.yaml:ro
    environment:
      KERBECS_CONFIG: ${KERBECS_CONFIG:?Set KERBECS_CONFIG in .env}
    depends_on:
      - runway
      - knowledge
      - web

  web:
    container_name: blix-web
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      runway:
        condition: service_started
    environment:
      WEB_RUNWAY_URL: ${WEB_RUNWAY_URL:?Set WEB_RUNWAY_URL in .env}
      WEB_KNOWLEDGE_URL: ${WEB_KNOWLEDGE_URL:?Set WEB_KNOWLEDGE_URL in .env}

  runway:
    container_name: blix-runway
    build:
      context: ./runway
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./runway:/app
      - runway_gopath:/go
    depends_on:
      db:
        condition: service_healthy
      nanomq:
        condition: service_started
    environment:
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      ENV: ${ENV:?Set ENV in .env}
      PORT: ${RUNWAY_PORT:?Set RUNWAY_PORT in .env}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      MQTT_URL: ${MQTT_URL:?Set MQTT_URL in .env}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:?Set MQTT_CLIENT_ID in .env}
      MQTT_ATTEMPT_READY_TOPIC: ${MQTT_ATTEMPT_READY_TOPIC:?Set MQTT_ATTEMPT_READY_TOPIC in .env}
      MQTT_RUN_EVENT_TOPIC_PREFIX: ${MQTT_RUN_EVENT_TOPIC_PREFIX:?Set MQTT_RUN_EVENT_TOPIC_PREFIX in .env}
      EXECUTION_LEASE_DURATION: ${EXECUTION_LEASE_DURATION:?Set EXECUTION_LEASE_DURATION in .env}
      EXECUTION_LEASE_SWEEP_INTERVAL: ${EXECUTION_LEASE_SWEEP_INTERVAL:?Set EXECUTION_LEASE_SWEEP_INTERVAL in .env}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:?Set WORKER_HEARTBEAT_INTERVAL in .env}
      WORKER_OFFLINE_AFTER: ${WORKER_OFFLINE_AFTER:?Set WORKER_OFFLINE_AFTER in .env}
      SENTINEL_URL: ${SENTINEL_URL:?Set SENTINEL_URL in .env}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID?Set SENTINEL_CLIENT_ID in .env}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET?Set SENTINEL_CLIENT_SECRET in .env}
      SENTINEL_SCOPES: ${SENTINEL_SCOPES:?Set SENTINEL_SCOPES in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}

  knowledge:
    container_name: blix-knowledge
    build:
      context: ./knowledge
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./knowledge:/app
      - knowledge_gopath:/go
      - knowledge_wiki:/data/wiki
      - knowledge_documents:/data/documents
    depends_on:
      db:
        condition: service_healthy
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      ENV: ${ENV:?Set ENV in .env}
      PORT: ${KNOWLEDGE_PORT:?Set KNOWLEDGE_PORT in .env}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT?Set EMBEDDING_ENDPOINT in .env}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY?Set EMBEDDING_API_KEY in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL?Set EMBEDDING_MODEL in .env}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:?Set EMBEDDING_REVISION in .env}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?Set EMBEDDING_DIMENSIONS in .env}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:?Set EMBEDDING_SEND_DIMENSIONS in .env}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:?Set DOCUMENT_STORAGE_PATH in .env}
      DEPOT_URL: ${DEPOT_URL?Set DEPOT_URL in .env}
      DEPOT_BUCKET: ${DEPOT_BUCKET:?Set DEPOT_BUCKET in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      WIKI_REPOSITORY_URL: ${WIKI_REPOSITORY_URL:?Set WIKI_REPOSITORY_URL in .env}
      WIKI_REPOSITORY_BRANCH: ${WIKI_REPOSITORY_BRANCH:?Set WIKI_REPOSITORY_BRANCH in .env}
      WIKI_REPOSITORY_PATH: ${WIKI_REPOSITORY_PATH:?Set WIKI_REPOSITORY_PATH in .env}
      GITHUB_APP_ID: ${GITHUB_APP_ID?Set GITHUB_APP_ID in .env}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID?Set GITHUB_APP_INSTALLATION_ID in .env}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY?Set GITHUB_APP_PRIVATE_KEY in .env}
      SENTINEL_URL: ${SENTINEL_URL:?Set SENTINEL_URL in .env}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID?Set SENTINEL_CLIENT_ID in .env}

  ingestion:
    container_name: blix-ingestion
    build:
      context: ./ingestion
      dockerfile: Dockerfile.dev
    working_dir: /app
    stop_grace_period: 20s
    init: true
    volumes:
      - ./ingestion:/app
      - ingestion_gopath:/go
    depends_on:
      runway:
        condition: service_started
      knowledge:
        condition: service_started
    environment:
      ENV: ${ENV:?Set ENV in .env}
      PORT: ${INGESTION_PORT:?Set INGESTION_PORT in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      DEPOT_URL: ${DEPOT_URL?Set DEPOT_URL in .env}
      DEPOT_BUCKET: ${DEPOT_BUCKET:?Set DEPOT_BUCKET in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}
      INGESTION_DOCUMENT_CONCURRENCY: ${INGESTION_DOCUMENT_CONCURRENCY:?Set INGESTION_DOCUMENT_CONCURRENCY in .env}
      INGESTION_PAGE_CONCURRENCY: ${INGESTION_PAGE_CONCURRENCY:?Set INGESTION_PAGE_CONCURRENCY in .env}
      INGESTION_GLOBAL_PAGE_CONCURRENCY: ${INGESTION_GLOBAL_PAGE_CONCURRENCY:?Set INGESTION_GLOBAL_PAGE_CONCURRENCY in .env}
      INGESTION_POLL_INTERVAL: ${INGESTION_POLL_INTERVAL:?Set INGESTION_POLL_INTERVAL in .env}
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O /dev/null "http://127.0.0.1:$$PORT/ready"']
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 60s

  discord:
    container_name: blix-discord
    build:
      context: ./discord
      dockerfile: Dockerfile.dev
    working_dir: /app
    init: true
    stop_grace_period: 20s
    volumes:
      - ./discord:/app
      - discord_gopath:/go
    depends_on:
      db:
        condition: service_healthy
      runway:
        condition: service_started
    environment:
      ENV: ${ENV:?Set ENV in .env}
      PORT: ${DISCORD_PORT:?Set DISCORD_PORT in .env}
      DISCORD_ENABLED: ${DISCORD_ENABLED:?Set DISCORD_ENABLED in .env}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID?Set DISCORD_GUILD_ID in .env}
      DISCORD_CHANNEL_IDS: ${DISCORD_CHANNEL_IDS?Set DISCORD_CHANNEL_IDS in .env}
      DISCORD_POLL_INTERVAL: ${DISCORD_POLL_INTERVAL:?Set DISCORD_POLL_INTERVAL in .env}
      BLIX_PUBLIC_URL: ${BLIX_PUBLIC_URL:?Set BLIX_PUBLIC_URL in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      SENTINEL_URL: ${SENTINEL_URL:?Set SENTINEL_URL in .env}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID?Set SENTINEL_CLIENT_ID in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:?Set DATABASE_SSL_MODE in .env}
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O /dev/null "http://127.0.0.1:$$PORT/ready"']
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 60s

  agent-worker-1:
    container_name: blix-agent-worker-1
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_1_venv:/app/.venv
    depends_on:
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:?Set AGENT_WORKER_CONCURRENCY in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      MQTT_HOST: ${MQTT_HOST:?Set MQTT_HOST in .env}
      MQTT_PORT: ${MQTT_PORT:?Set MQTT_PORT in .env}
      MQTT_ATTEMPT_READY_TOPIC: ${MQTT_ATTEMPT_READY_TOPIC:?Set MQTT_ATTEMPT_READY_TOPIC in .env}
      SENTINEL_URL: ${SENTINEL_URL:?Set SENTINEL_URL in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}

  agent-worker-2:
    container_name: blix-agent-worker-2
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_2_venv:/app/.venv
    depends_on:
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:?Set AGENT_WORKER_CONCURRENCY in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      MQTT_HOST: ${MQTT_HOST:?Set MQTT_HOST in .env}
      MQTT_PORT: ${MQTT_PORT:?Set MQTT_PORT in .env}
      MQTT_ATTEMPT_READY_TOPIC: ${MQTT_ATTEMPT_READY_TOPIC:?Set MQTT_ATTEMPT_READY_TOPIC in .env}
      SENTINEL_URL: ${SENTINEL_URL:?Set SENTINEL_URL in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}

  agent-worker-3:
    container_name: blix-agent-worker-3
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_3_venv:/app/.venv
    depends_on:
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:?Set AGENT_WORKER_CONCURRENCY in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      MQTT_HOST: ${MQTT_HOST:?Set MQTT_HOST in .env}
      MQTT_PORT: ${MQTT_PORT:?Set MQTT_PORT in .env}
      MQTT_ATTEMPT_READY_TOPIC: ${MQTT_ATTEMPT_READY_TOPIC:?Set MQTT_ATTEMPT_READY_TOPIC in .env}
      SENTINEL_URL: ${SENTINEL_URL:?Set SENTINEL_URL in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}

  db:
    container_name: blix-db
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql

  nanomq:
    container_name: blix-nanomq
    image: emqx/nanomq:0.25.6

volumes:
  discord_gopath:
  ingestion_gopath:
  knowledge_documents:
  agent_worker_1_venv:
  agent_worker_2_venv:
  agent_worker_3_venv:
  pgdata:
  knowledge_gopath:
  knowledge_wiki:
  runway_gopath:
  web_node_modules:
