name: blix

services:
  kerbecs:
    container_name: blix-kerbecs
    image: bk1031/kerbecs:latest
    restart: always
    ports:
      - "127.0.0.1:10310:10310"
    volumes:
      - ./kerbecs.yaml:/etc/kerbecs/kerbecs.yaml:ro
    environment:
      KERBECS_CONFIG: /etc/kerbecs/kerbecs.yaml
    depends_on:
      - runway
      - web

  web:
    container_name: blix-web
    image: node:22-alpine
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      runway:
        condition: service_started
    environment:
      WEB_RUNWAY_URL: http://runway:9999

  cli:
    profiles:
      - manual
    build:
      context: ./cli
      dockerfile: Dockerfile.dev
    working_dir: /app
    stdin_open: true
    tty: true
    volumes:
      - ./cli:/app
      - cli_gopath:/go
      - cli_build_cache:/root/.cache/go-build
    environment:
      RUNWAY_URL: ${CLI_RUNWAY_URL:-http://host.docker.internal:10400}

  runway:
    container_name: blix-runway
    build:
      context: ./runway
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    ports:
      - "127.0.0.1:10400:9999"
    volumes:
      - ./runway:/app
      - runway_gopath:/go
    depends_on:
      db:
        condition: service_healthy
      nanomq:
        condition: service_started
    environment:
      ENV: DEV
      PORT: 9999
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: blix
      MQTT_URL: mqtt://nanomq:1883
      MQTT_CLIENT_ID: blix-runway
      MQTT_EXECUTION_READY_TOPIC: blix/v1/executions/ready
      MQTT_RUN_EVENT_TOPIC_PREFIX: blix/v1/runs
      EXECUTION_LEASE_DURATION: ${EXECUTION_LEASE_DURATION:-30s}
      EXECUTION_LEASE_SWEEP_INTERVAL: ${EXECUTION_LEASE_SWEEP_INTERVAL:-5s}

  agent-worker:
    container_name: blix-agent-worker
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_venv:/app/.venv
    depends_on:
      runway:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-4}
      RUNWAY_URL: http://runway:9999
      MQTT_HOST: nanomq
      MQTT_PORT: 1883
      MQTT_EXECUTION_READY_TOPIC: $$share/blix-agent-workers/blix/v1/executions/ready

  db:
    container_name: blix-db
    image: postgres:18-alpine
    restart: always
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blix"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql

  nanomq:
    container_name: blix-nanomq
    image: emqx/nanomq:0.25.6
    restart: always
    ports:
      - "127.0.0.1:1883:1883"

volumes:
  agent_worker_venv:
  cli_build_cache:
  cli_gopath:
  pgdata:
  runway_gopath:
  web_node_modules:
