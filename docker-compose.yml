name: blix

services:
  cli:
    profiles:
      - cli
    build:
      context: ./cli
      dockerfile: Dockerfile.dev
    working_dir: /app
    stdin_open: true
    tty: true
    network_mode: host
    user: "${BLIX_CLI_UID:?Set BLIX_CLI_UID in .env}:${BLIX_CLI_GID:?Set BLIX_CLI_GID in .env}"
    environment:
      HOME: /home/blix
      BLIX_URL: ${BLIX_URL:?Set BLIX_URL in .env}
    volumes:
      - ${BLIX_CREDENTIALS_DIR:?Set BLIX_CREDENTIALS_DIR in .env}:/home/blix/.blix

  kerbecs:
    container_name: blix-kerbecs
    image: bk1031/kerbecs:latest
    ports:
      - "127.0.0.1:10310:10310"
    volumes:
      - ./kerbecs.yaml:/etc/kerbecs/kerbecs.yaml:ro
    environment:
      KERBECS_CONFIG: /etc/kerbecs/kerbecs.yaml
    depends_on:
      - runway
      - knowledge
      - web

  web:
    container_name: blix-web
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      runway:
        condition: service_started
    environment:
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}

  runway:
    container_name: blix-runway
    build:
      context: ./runway
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./runway:/app
      - runway_gopath:/go
    depends_on:
      db:
        condition: service_healthy
      nanomq:
        condition: service_started
    environment:
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      ENV: ${ENV:?Set ENV in .env}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      MQTT_URL: ${MQTT_URL:?Set MQTT_URL in .env}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID?Set SENTINEL_CLIENT_ID in .env}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET?Set SENTINEL_CLIENT_SECRET in .env}
      SENTINEL_SCOPES: ${SENTINEL_SCOPES:-user:read groups:read}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}

  knowledge:
    container_name: blix-knowledge
    build:
      context: ./knowledge
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./knowledge:/app
      - knowledge_gopath:/go
      - knowledge_wiki:/data/wiki
      - knowledge_documents:/data/documents
    depends_on:
      db:
        condition: service_healthy
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      ENV: ${ENV:?Set ENV in .env}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT?Set EMBEDDING_ENDPOINT in .env}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY?Set EMBEDDING_API_KEY in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL?Set EMBEDDING_MODEL in .env}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
      DOCUMENT_STORAGE_PATH: /data/documents
      DEPOT_URL: ${DEPOT_URL?Set DEPOT_URL in .env}
      DEPOT_BUCKET: ${DEPOT_BUCKET:?Set DEPOT_BUCKET in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      WIKI_REPOSITORY_PATH: /data/wiki
      GITHUB_APP_ID: ${GITHUB_APP_ID?Set GITHUB_APP_ID in .env}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID?Set GITHUB_APP_INSTALLATION_ID in .env}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY?Set GITHUB_APP_PRIVATE_KEY in .env}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID?Set SENTINEL_CLIENT_ID in .env}

  ingestion:
    container_name: blix-ingestion
    build:
      context: ./ingestion
      dockerfile: Dockerfile.dev
    working_dir: /app
    stop_grace_period: 20s
    init: true
    volumes:
      - ./ingestion:/app
      - ingestion_gopath:/go
    depends_on:
      runway:
        condition: service_started
      knowledge:
        condition: service_started
    environment:
      ENV: ${ENV:?Set ENV in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      DEPOT_URL: ${DEPOT_URL?Set DEPOT_URL in .env}
      DEPOT_BUCKET: ${DEPOT_BUCKET:?Set DEPOT_BUCKET in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9977/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 60s

  discord:
    container_name: blix-discord
    build:
      context: ./discord
      dockerfile: Dockerfile.dev
    working_dir: /app
    init: true
    stop_grace_period: 20s
    volumes:
      - ./discord:/app
      - discord_gopath:/go
    depends_on:
      db:
        condition: service_healthy
      runway:
        condition: service_started
    environment:
      ENV: ${ENV:?Set ENV in .env}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN?Set DISCORD_BOT_TOKEN in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID?Set DISCORD_GUILD_ID in .env}
      BLIX_PUBLIC_URL: ${BLIX_PUBLIC_URL:?Set BLIX_PUBLIC_URL in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID?Set SENTINEL_CLIENT_ID in .env}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9966/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 60s

  sandbox-docker:
    image: docker:29.5.1-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=unix:///docker/docker.sock", "--group=0", "--storage-driver=overlay2"]
    volumes:
      - sandbox_socket:/docker
      - sandbox_docker_data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "--host=unix:///docker/docker.sock", "info"]
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox-image:
    image: docker:29.5.1-cli
    restart: "no"
    depends_on:
      sandbox-docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: unix:///docker/docker.sock
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-blix-ohmypi:18.5.0}
    volumes:
      - sandbox_socket:/docker
      - ./sandbox-worker/images/ohmypi:/build:ro
    command: ["sh", "-ec", 'docker build --tag "$$SANDBOX_IMAGE" /build']

  sandbox-worker:
    build:
      context: ./sandbox-worker
      dockerfile: Dockerfile
    init: true
    container_name: blix-sandbox-worker
    depends_on:
      sandbox-docker:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    volumes:
      - sandbox_socket:/docker
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import os, urllib.request;
          request = urllib.request.Request("http://127.0.0.1:8080/health",
          headers={"Authorization": "Bearer " + os.environ["BLIX_INTERNAL_TOKEN"]});
          urllib.request.urlopen(request, timeout=3).close()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-blix-ohmypi:18.5.0}
      SANDBOX_MODEL: ${SANDBOX_MODEL:-gpt-6-astra}
      SANDBOX_REPOSITORIES: ${SANDBOX_REPOSITORIES:-gaucho-racing/*}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-2}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-1800}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-2048}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2}
      SANDBOX_GITHUB_TOKEN: ${SANDBOX_GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      SANDBOX_COMMIT_NAME: ${SANDBOX_COMMIT_NAME:-}
      SANDBOX_COMMIT_EMAIL: ${SANDBOX_COMMIT_EMAIL:-}
      LLM_GATEWAY_ENDPOINT: ${LLM_GATEWAY_ENDPOINT:?Set LLM_GATEWAY_ENDPOINT}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:?Set LLM_GATEWAY_API_KEY}

  agent-worker-1:
    container_name: blix-agent-worker-1
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_1_venv:/app/.venv
    depends_on:
      sandbox-worker:
        condition: service_healthy
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      MQTT_URL: ${MQTT_URL:?Set MQTT_URL in .env}
      SANDBOX_URL: http://sandbox-worker:8080
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}

  agent-worker-2:
    container_name: blix-agent-worker-2
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_2_venv:/app/.venv
    depends_on:
      sandbox-worker:
        condition: service_healthy
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      MQTT_URL: ${MQTT_URL:?Set MQTT_URL in .env}
      SANDBOX_URL: http://sandbox-worker:8080
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}

  agent-worker-3:
    container_name: blix-agent-worker-3
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_3_venv:/app/.venv
    depends_on:
      sandbox-worker:
        condition: service_healthy
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      BLIX_INTERNAL_TOKEN: ${BLIX_INTERNAL_TOKEN:?Set BLIX_INTERNAL_TOKEN in .env}
      RUNWAY_URL: ${RUNWAY_URL:?Set RUNWAY_URL in .env}
      KNOWLEDGE_URL: ${KNOWLEDGE_URL:?Set KNOWLEDGE_URL in .env}
      MQTT_URL: ${MQTT_URL:?Set MQTT_URL in .env}
      SANDBOX_URL: http://sandbox-worker:8080
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN?Set SENTINEL_SERVICE_ACCOUNT_TOKEN in .env}

  db:
    container_name: blix-db
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql

  nanomq:
    container_name: blix-nanomq
    image: emqx/nanomq:0.25.6

volumes:
  sandbox_socket:
  sandbox_docker_data:
  discord_gopath:
  ingestion_gopath:
  knowledge_documents:
  agent_worker_1_venv:
  agent_worker_2_venv:
  agent_worker_3_venv:
  pgdata:
  knowledge_gopath:
  knowledge_wiki:
  runway_gopath:
  web_node_modules:
