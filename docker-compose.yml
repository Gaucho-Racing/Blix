name: blix

services:
  cli:
    profiles:
      - cli
    build:
      context: ./cli
      dockerfile: Dockerfile.dev
    working_dir: /app
    stdin_open: true
    tty: true
    network_mode: host
    user: "${BLIX_CLI_UID:-0}:${BLIX_CLI_GID:-0}"
    environment:
      HOME: /home/blix
      BLIX_URL: ${BLIX_URL:-http://host.docker.internal:10310}
    volumes:
      - ${BLIX_CREDENTIALS_DIR:-/tmp/blix-cli-credentials}:/home/blix/.blix

  kerbecs:
    container_name: blix-kerbecs
    image: bk1031/kerbecs:latest
    restart: always
    ports:
      - "127.0.0.1:10310:10310"
    volumes:
      - ./kerbecs.yaml:/etc/kerbecs/kerbecs.yaml:ro
    environment:
      KERBECS_CONFIG: /etc/kerbecs/kerbecs.yaml
    depends_on:
      - runway
      - web

  web:
    container_name: blix-web
    image: node:22-alpine
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      runway:
        condition: service_started
    environment:
      WEB_RUNWAY_URL: http://runway:9999

  runway:
    container_name: blix-runway
    build:
      context: ./runway
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    volumes:
      - ./runway:/app
      - runway_gopath:/go
    depends_on:
      db:
        condition: service_healthy
      nanomq:
        condition: service_started
    environment:
      ENV: DEV
      PORT: 9999
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: blix
      MQTT_URL: mqtt://nanomq:1883
      MQTT_CLIENT_ID: blix-runway
      MQTT_EXECUTION_READY_TOPIC: blix/v1/executions/ready
      MQTT_RUN_EVENT_TOPIC_PREFIX: blix/v1/runs
      EXECUTION_LEASE_DURATION: ${EXECUTION_LEASE_DURATION:-30s}
      EXECUTION_LEASE_SWEEP_INTERVAL: ${EXECUTION_LEASE_SWEEP_INTERVAL:-5s}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-5s}
      WORKER_OFFLINE_AFTER: ${WORKER_OFFLINE_AFTER:-15s}
      SENTINEL_URL: ${SENTINEL_URL:-https://sso.gauchoracing.com}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
      SENTINEL_SCOPES: ${SENTINEL_SCOPES:-user:read groups:read}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN:-}

  knowledge:
    container_name: blix-knowledge
    build:
      context: ./knowledge
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    volumes:
      - ./knowledge:/app
      - knowledge_gopath:/go
      - knowledge_wiki:/data/wiki
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: DEV
      PORT: 9988
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: blix
      WIKI_REPOSITORY_URL: https://github.com/gaucho-racing/blixwiki.git
      WIKI_REPOSITORY_BRANCH: main
      WIKI_REPOSITORY_PATH: /data/wiki
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}

  agent-worker-1:
    container_name: blix-agent-worker-1
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_1_venv:/app/.venv
    depends_on:
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-4}
      RUNWAY_URL: http://runway:9999
      KNOWLEDGE_URL: http://knowledge:9988
      MQTT_HOST: nanomq
      MQTT_PORT: 1883
      MQTT_EXECUTION_READY_TOPIC: $$share/blix-agent-workers/blix/v1/executions/ready
      SENTINEL_URL: ${SENTINEL_URL:-https://sso.gauchoracing.com}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN:-}

  agent-worker-2:
    container_name: blix-agent-worker-2
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_2_venv:/app/.venv
    depends_on:
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-4}
      RUNWAY_URL: http://runway:9999
      KNOWLEDGE_URL: http://knowledge:9988
      MQTT_HOST: nanomq
      MQTT_PORT: 1883
      MQTT_EXECUTION_READY_TOPIC: $$share/blix-agent-workers/blix/v1/executions/ready
      SENTINEL_URL: ${SENTINEL_URL:-https://sso.gauchoracing.com}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN:-}

  agent-worker-3:
    container_name: blix-agent-worker-3
    build:
      context: ./agent-worker
      dockerfile: Dockerfile.dev
    restart: always
    working_dir: /app
    volumes:
      - ./agent-worker:/app
      - agent_worker_3_venv:/app/.venv
    depends_on:
      runway:
        condition: service_started
      knowledge:
        condition: service_started
      nanomq:
        condition: service_started
    env_file:
      - ./.env
    environment:
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-4}
      RUNWAY_URL: http://runway:9999
      KNOWLEDGE_URL: http://knowledge:9988
      MQTT_HOST: nanomq
      MQTT_PORT: 1883
      MQTT_EXECUTION_READY_TOPIC: $$share/blix-agent-workers/blix/v1/executions/ready
      SENTINEL_URL: ${SENTINEL_URL:-https://sso.gauchoracing.com}
      SENTINEL_SERVICE_ACCOUNT_TOKEN: ${SENTINEL_SERVICE_ACCOUNT_TOKEN:-}

  db:
    container_name: blix-db
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blix"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql

  nanomq:
    container_name: blix-nanomq
    image: emqx/nanomq:0.25.6
    restart: always

volumes:
  agent_worker_1_venv:
  agent_worker_2_venv:
  agent_worker_3_venv:
  pgdata:
  knowledge_gopath:
  knowledge_wiki:
  runway_gopath:
  web_node_modules:
