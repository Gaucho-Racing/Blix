[project]
name = "blix-sandbox-worker"
version = "0.1.0"
description = "Worker that manages disposable coding sandboxes for Blix"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.13.5,<3.0.0",
]

[project.scripts]
blix-sandbox-worker = "blix_sandbox_worker.host:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blix_sandbox_worker"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/blix_sandbox_worker/host.py" = ["N815"]
