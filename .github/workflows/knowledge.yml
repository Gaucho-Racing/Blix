name: knowledge
run-name: Triggered by ${{ github.event_name }} to ${{ github.ref }} by @${{ github.actor }}

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            pair: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            pair: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./knowledge
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/gaucho-racing/blix-knowledge,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: |
            type=gha,scope=${{ github.workflow }}-${{ matrix.pair }}-${{ github.ref }}-${{ github.event_name }}
            type=gha,scope=${{ github.workflow }}-${{ matrix.pair }}-refs/heads/main-push
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.pair }}-${{ github.ref }}-${{ github.event_name }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gaucho-racing/blix-knowledge
          flavor: latest=false
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
      - name: Create and inspect manifest
        env:
          IMAGE: ghcr.io/gaucho-racing/blix-knowledge
          TAGS: ${{ steps.metadata.outputs.tags }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=(-t "$tag")
            fi
          done <<< "$TAGS"
          sources=()
          for file in "$DIGEST_DIRECTORY"/*; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          [ "${#sources[@]}" -eq 2 ]
          [ "${#tag_args[@]}" -gt 0 ]
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools inspect "$tag"
            fi
          done <<< "$TAGS"
