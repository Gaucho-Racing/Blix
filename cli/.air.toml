root = "."
tmp_dir = "/tmp/blix-air"

[build]
  cmd = "go build -o /tmp/blix-air/blix-cli ."
  entrypoint = ["/bin/true"]
  delay = 300
  exclude_dir = [".git", "dev"]
  include_ext = ["go", "mod", "sum"]
  kill_delay = "0s"
  poll = true
  poll_interval = 500
  send_interrupt = true
  stop_on_error = true

[log]
  silent = true

[misc]
  clean_on_exit = true
