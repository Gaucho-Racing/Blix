gateway:
  name: blix-gateway
  version: 0.1.0
  env: ${ENV:DEV}
  timeouts:
    dial: 5s
    headers: 30s
    idle: 50s
    overall: 0

listeners:
  gateway:
    port: "10310"
    cors:
      enabled: true
      allowed_origins: ["*"]
      allow_credentials: false
  admin:
    port: "10300"
    auth:
      type: basic
      username: ${KERBECS_USER:admin}
      password: ${KERBECS_PASSWORD:admin}

providers:
  static:
    watch: false

upstreams:
  knowledge:
    name: blix-knowledge
    version: 0.1.0
    instances:
      - http://knowledge:9988

  runway:
    name: blix-runway
    version: 0.1.0
    instances:
      - http://runway:9999

  web:
    name: blix-web
    version: 0.1.0
    instances:
      - http://web:5173

routes:
  - name: knowledge-api
    match:
      path: /api/knowledge/v1/*
    upstream: knowledge
    rewrite:
      strip_prefix: /api/knowledge
    envelope: passthrough

  - name: knowledge-ping
    match:
      path: /api/knowledge/ping
    upstream: knowledge
    rewrite:
      strip_prefix: /api/knowledge
    envelope: passthrough

  - name: runway-api
    match:
      path: /api/*
    upstream: runway
    rewrite:
      strip_prefix: /api
    envelope: passthrough

  - name: blix-web
    match:
      path: /*
    upstream: web
    envelope: passthrough
